<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Lost & Found System</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <div class="logo-text">
                    <h2>SIBA<span id="uni">UNI</span></h2>
                </div>
                <h3 class="lostfound">Lost & Found</h3>
            </div>


            <div class="navlinks">
                <ul>
                    <li class="active"><a href="#">Home</a></li>
                    <li><a href="#">Lost Items</a></li>
                    <li><a href="#">Found Items</a></li>
                    <li><a href="#">About Us</a></li>
                </ul>
            </div>

            <div class="navbright">
                <a href="#" id="report-icon">
                    <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-plus">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    <!-- FontAwesome Class -->
                    <i class="fa-solid fa-circle-plus plus-icon"></i>
                    <h3 id="report-text">Report Items</h3>
                </a>

                <div class="navbtns">
                    <button class="btns" id="login-btn">Login</button>
                    <button class="btns" id="register-btn">Register</button>
                </div>
            </div>
        </nav>
    </header>


    <main class="main">
        <section class="hero-section">
            <div class="descriptionn">
                <div id="title">
                    <h1>Recover What <span id="matters">Matters.</span></h1>
                </div>
                <div id="para">
                    <p>Lost something on campus? Our intelligent matching system connects lost and found reports
                        automatically — helping SLIIT students recover their belongings faster than ever.</p>
                </div>
            </div>
        </section>
    </main>




</body>

</html>

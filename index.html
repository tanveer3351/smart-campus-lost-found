<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Lost & Found System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <div class="logo-text">
                    <h2>SIBA<span id="uni">UNI</span></h2>
                </div>
                <h3 class="lostfound">Lost & Found</h3>
            </div>


            <div class="navlinks">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Lost Items</a></li>
                    <li><a href="">Found Items</a></li>
                    <li><a href="">About Us</a></li>
                </ul>
            </div>

            <div class="navbright">
                <a href="#" id="report-icon">
                    <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-plus">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    <!-- FontAwesome Class -->
                    <i class="fa-solid fa-circle-plus"></i>

                </a>

                <div class="navbtns">
                    <button class="btns" id="login-btn">Login</button>
                    <button class="btns" id="register-btn">Register</button>
                </div>
            </div>
        </nav>

</html>
